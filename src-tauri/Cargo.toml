[package]
name = "wattclean"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WattClean: disk cleaner, registry cleaner (Windows) and uninstaller in one app"

[lib]
name = "wattclean_lib"
# Desktop only: main.rs links the rlib.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wcc-core = { workspace = true }
wrc-core = { workspace = true }
wu-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The notification-area icon: open a module, quit, and keep the Registry
# Watcher running with the window closed.
tauri = { version = "2", features = ["tray-icon"] }
# Windows' own Open and Save dialogs, shown from Rust only.
tauri-plugin-dialog = "2"
# A second launch shows the running window instead of opening a copy.
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
wcc-windows = { workspace = true }
wrc-windows = { workspace = true }
wu-windows = { workspace = true }

[target.'cfg(unix)'.dependencies]
wcc-unix = { workspace = true }
wu-unix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

# `fake-system` swaps Windows for test machines (a sandboxed disk, an
# in-memory registry and installed programs) so the WebDriver suite drives
# the real binary without touching this PC. On Linux and macOS it swaps the
# disk only. Off by default, so a release
# build never contains it; scripts/verify.sh asserts that.
[features]
default = []
fake-system = ["wcc-core/fake", "wrc-core/fake", "wu-core/fake"]
