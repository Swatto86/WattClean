# Everyday applications. Electron apps (Discord, Slack, Teams and others)
# share the "electron" template; {root} is the app's data folder.

[[template]]
id = "electron"

[[template.option]]
id = "cache"
name = "Cache"
description = "Downloaded images, scripts and compiled code the app keeps"
default = true
actions = [
  { op = "delete", search = "walk.all", path = '{root}\Cache' },
  { op = "delete", search = "walk.all", path = '{root}\Code Cache' },
  { op = "delete", search = "walk.all", path = '{root}\GPUCache' },
  { op = "delete", search = "walk.all", path = '{root}\DawnCache' },
  { op = "delete", search = "walk.all", path = '{root}\DawnGraphiteCache' },
  { op = "delete", search = "walk.all", path = '{root}\DawnWebGPUCache' },
  { op = "delete", search = "walk.all", path = '{root}\Service Worker\CacheStorage' },
  { op = "delete", search = "walk.all", path = '{root}\Service Worker\ScriptCache' },
]

[[template.option]]
id = "logs"
name = "Logs"
description = "The app's log files"
default = true
actions = [{ op = "delete", search = "walk.all", path = '{root}\logs' }]

[[template.option]]
id = "crash_reports"
name = "Crash reports"
description = "Reports kept after the app crashed"
default = true
actions = [
  { op = "delete", search = "walk.all", path = '{root}\Crashpad\reports' },
  { op = "delete", search = "walk.all", path = '{root}\Crashpad\completed' },
  { op = "delete", search = "walk.all", path = '{root}\Crashpad\pending' },
]

