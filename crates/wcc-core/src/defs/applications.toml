[[cleaner]]
id = "office"
name = "Microsoft Office"
description = "Word, Excel, PowerPoint and the rest"
category = "applications"
detect = ['%APPDATA%\Microsoft\Office', '%LOCALAPPDATA%\Microsoft\Office']
running = ["winword.exe", "excel.exe", "powerpnt.exe", "outlook.exe", "onenote.exe"]

[[cleaner.option]]
id = "cache"
name = "Cache"
description = "Office's document cache and add-in cache"
warning = "The document cache can hold changes that have not uploaded yet. Let Office finish syncing first, or they are lost."
default = true
actions = [
  { op = "delete", search = "walk.all", path = '%LOCALAPPDATA%\Microsoft\Office\16.0\OfficeFileCache' },
  { op = "delete", search = "walk.all", path = '%LOCALAPPDATA%\Microsoft\Office\16.0\Wef' },
  { op = "delete", search = "walk.all", path = '%LOCALAPPDATA%\Microsoft\Office\OTele' },
]

[[cleaner.option]]
id = "recent"
name = "Recent documents"
description = "The recent lists in Office and its shortcuts to recent files"
actions = [
  { op = "delete", search = "glob", path = '%APPDATA%\Microsoft\Office\Recent\*', kind = "file" },
  { op = "registry", key = 'HKCU\Software\Microsoft\Office\16.0\Word\User MRU' },
  { op = "registry", key = 'HKCU\Software\Microsoft\Office\16.0\Excel\User MRU' },
  { op = "registry", key = 'HKCU\Software\Microsoft\Office\16.0\PowerPoint\User MRU' },
  { op = "registry", key = 'HKCU\Software\Microsoft\Office\16.0\Word\File MRU' },
  { op = "registry", key = 'HKCU\Software\Microsoft\Office\16.0\Excel\File MRU' },
  { op = "registry", key = 'HKCU\Software\Microsoft\Office\16.0\PowerPoint\File MRU' },
  { op = "registry", key = 'HKCU\Software\Microsoft\Office\15.0\Word\File MRU' },
  { op = "registry", key = 'HKCU\Software\Microsoft\Office\15.0\Excel\File MRU' },
  { op = "registry", key = 'HKCU\Software\Microsoft\Office\15.0\PowerPoint\File MRU' },
]

