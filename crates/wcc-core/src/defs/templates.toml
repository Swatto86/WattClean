# Templates every platform's cleaners share: options for all Chromium
# browsers, all Firefox browsers and all Electron apps. A cleaner names a
# template and says where its folders are; paths here may use either
# separator, each platform reads them its own way.
#
# chromium: {root} is the browser's data folder, {profile} each profile
#   folder in it, {cache} each folder holding a profile's cache (on Linux
#   and macOS the cache lives apart from the profile).
# firefox: {base} holds Profiles (or set {root} to the profiles folder),
#   {cachebase} the cache's Profiles folder (or set {cache}).
# electron: {root} is the app's data folder.

[[template]]
id = "chromium"
vars = { profile = '{root}\*', cache = '{profile}' }

[[template.option]]
id = "cache"
name = "Cache"
description = "Web pages, images, scripts and compiled code kept to load sites faster"
default = true
actions = [
  { op = "delete", search = "walk.all", path = '{cache}\Cache' },
  { op = "delete", search = "walk.all", path = '{cache}\Code Cache' },
  { op = "delete", search = "walk.all", path = '{cache}\GPUCache' },
  { op = "delete", search = "walk.all", path = '{cache}\Media Cache' },
  { op = "delete", search = "walk.all", path = '{cache}\Application Cache' },
  { op = "delete", search = "walk.all", path = '{cache}\DawnCache' },
  { op = "delete", search = "walk.all", path = '{cache}\DawnGraphiteCache' },
  { op = "delete", search = "walk.all", path = '{cache}\DawnWebGPUCache' },
  # Where the disk cache lives apart from the profile (Linux, macOS, Opera),
  # the profile still holds these.
  { op = "delete", search = "walk.all", path = '{profile}\Code Cache' },
  { op = "delete", search = "walk.all", path = '{profile}\GPUCache' },
  { op = "delete", search = "walk.all", path = '{profile}\DawnCache' },
  { op = "delete", search = "walk.all", path = '{profile}\DawnGraphiteCache' },
  { op = "delete", search = "walk.all", path = '{profile}\DawnWebGPUCache' },
  { op = "delete", search = "walk.all", path = '{profile}\Service Worker\CacheStorage' },
  { op = "delete", search = "walk.all", path = '{profile}\Service Worker\ScriptCache' },
  { op = "delete", search = "walk.all", path = '{root}\GrShaderCache' },
  { op = "delete", search = "walk.all", path = '{root}\GraphiteDawnCache' },
  { op = "delete", search = "walk.all", path = '{root}\ShaderCache' },
]

[[template.option]]
id = "cookies"
name = "Cookies"
description = "Small files sites keep to recognise you, including sign-ins"
warning = "You will be signed out of most websites."
actions = [
  { op = "delete", search = "glob", path = '{profile}\Cookies', kind = "file" },
  { op = "delete", search = "glob", path = '{profile}\Cookies-journal', kind = "file" },
  { op = "delete", search = "glob", path = '{profile}\Network\Cookies', kind = "file" },
  { op = "delete", search = "glob", path = '{profile}\Network\Cookies-journal', kind = "file" },
  { op = "delete", search = "glob", path = '{profile}\Extension Cookies', kind = "file" },
  { op = "delete", search = "glob", path = '{profile}\Extension Cookies-journal', kind = "file" },
]

[[template.option]]
id = "history"
name = "History"
description = "Visited pages, search terms, most-visited tiles and address-bar suggestions"
actions = [
  { op = "sqlite", search = "glob", path = '{profile}\History', sql = "chrome-history" },
  { op = "delete", search = "glob", path = '{profile}\History Provider Cache', kind = "file" },
  { op = "delete", search = "glob", path = '{profile}\Top Sites', kind = "file" },
  { op = "delete", search = "glob", path = '{profile}\Top Sites-journal', kind = "file" },
  { op = "delete", search = "glob", path = '{profile}\Visited Links', kind = "file" },
  { op = "delete", search = "glob", path = '{profile}\Shortcuts', kind = "file" },
  { op = "delete", search = "glob", path = '{profile}\Shortcuts-journal', kind = "file" },
  { op = "delete", search = "glob", path = '{profile}\Network Action Predictor', kind = "file" },
  { op = "delete", search = "glob", path = '{profile}\Network Action Predictor-journal', kind = "file" },
]

[[template.option]]
id = "downloads"
name = "Download history"
description = "The list of downloaded files (the files themselves stay)"
actions = [{ op = "sqlite", search = "glob", path = '{profile}\History', sql = "chrome-downloads" }]

[[template.option]]
id = "session"
name = "Session"
description = "The tabs and windows open last time"
warning = "Your open tabs will not be restored the next time the browser starts."
actions = [
  { op = "delete", search = "glob", path = '{profile}\Current Session', kind = "file" },
  { op = "delete", search = "glob", path = '{profile}\Current Tabs', kind = "file" },
  { op = "delete", search = "glob", path = '{profile}\Last Session', kind = "file" },
  { op = "delete", search = "glob", path = '{profile}\Last Tabs', kind = "file" },
  { op = "delete", search = "walk.all", path = '{profile}\Sessions' },
]

[[template.option]]
id = "forms"
name = "Form history"
description = "Words typed into web forms and saved addresses"
actions = [{ op = "sqlite", search = "glob", path = '{profile}\Web Data', sql = "chrome-autofill" }]

[[template.option]]
id = "passwords"
name = "Saved passwords"
description = "Passwords the browser saved on this PC"
warning = "Saved passwords are deleted from this PC. Passwords synced to an account may come back."
actions = [
  { op = "delete", search = "glob", path = '{profile}\Login Data', kind = "file" },
  { op = "delete", search = "glob", path = '{profile}\Login Data-journal', kind = "file" },
  { op = "delete", search = "glob", path = '{profile}\Login Data For Account', kind = "file" },
  { op = "delete", search = "glob", path = '{profile}\Login Data For Account-journal', kind = "file" },
]

[[template.option]]
id = "site_storage"
name = "Site storage"
description = "Data sites keep on your PC: local storage, IndexedDB and file systems"
warning = "Sites forget data they keep locally, such as offline mail, game progress and settings."
actions = [
  { op = "delete", search = "walk.all", path = '{profile}\Local Storage' },
  { op = "delete", search = "walk.all", path = '{profile}\Session Storage' },
  { op = "delete", search = "walk.all", path = '{profile}\IndexedDB', exclude = ['{profile}\IndexedDB\chrome-extension_*'] },
  { op = "delete", search = "walk.all", path = '{profile}\databases', exclude = ['{profile}\databases\chrome-extension_*'] },
  { op = "delete", search = "walk.all", path = '{profile}\File System' },
]

[[template.option]]
id = "search_engines"
name = "Site search engines"
description = "Search engines sites added by themselves (yours and the default stay)"
actions = [{ op = "sqlite", search = "glob", path = '{profile}\Web Data', sql = "chrome-keywords" }]

[[template.option]]
id = "crash_reports"
name = "Crash reports"
description = "Reports kept after the browser crashed"
default = true
actions = [
  { op = "delete", search = "walk.all", path = '{root}\Crashpad\reports' },
  # macOS and Linux keep them by state.
  { op = "delete", search = "walk.all", path = '{root}\Crashpad\completed' },
  { op = "delete", search = "walk.all", path = '{root}\Crashpad\pending' },
  { op = "delete", search = "walk.all", path = '{root}\Crashpad\new' },
  { op = "delete", search = "walk.all", path = '{root}\Crashpad\attachments' },
]

[[template.option]]
id = "vacuum"
name = "Vacuum"
description = "Compact the browser's databases to give back unused space (keeps their data)"
actions = [
  { op = "sqlite", search = "glob", path = '{profile}\History', sql = "vacuum" },
  { op = "sqlite", search = "glob", path = '{profile}\Web Data', sql = "vacuum" },
  { op = "sqlite", search = "glob", path = '{profile}\Favicons', sql = "vacuum" },
  { op = "sqlite", search = "glob", path = '{profile}\Top Sites', sql = "vacuum" },
  { op = "sqlite", search = "glob", path = '{profile}\Shortcuts', sql = "vacuum" },
  { op = "sqlite", search = "glob", path = '{profile}\Network\Cookies', sql = "vacuum" },
  { op = "sqlite", search = "glob", path = '{profile}\Login Data', sql = "vacuum" },
]

[[template]]
id = "firefox"
vars = { root = '{base}\Profiles', cache = '{cachebase}\Profiles' }

[[template.option]]
id = "cache"
name = "Cache"
description = "Web pages, images and scripts kept to load sites faster"
default = true
actions = [
  { op = "delete", search = "walk.all", path = '{cache}\*\cache2' },
  { op = "delete", search = "walk.all", path = '{cache}\*\startupCache' },
  { op = "delete", search = "walk.all", path = '{cache}\*\thumbnails' },
  { op = "delete", search = "walk.all", path = '{cache}\*\jumpListCache' },
  { op = "delete", search = "walk.all", path = '{cache}\*\OfflineCache' },
  { op = "delete", search = "walk.all", path = '{root}\*\shader-cache' },
]

[[template.option]]
id = "cookies"
name = "Cookies"
description = "Small files sites keep to recognise you, including sign-ins"
warning = "You will be signed out of most websites."
actions = [{ op = "delete", search = "glob", path = '{root}\*\cookies.sqlite*', kind = "file" }]

[[template.option]]
id = "history"
name = "History"
description = "Visited pages and typed addresses; bookmarks stay"
actions = [
  { op = "sqlite", search = "glob", path = '{root}\*\places.sqlite', sql = "mozilla-history" },
  { op = "delete", search = "glob", path = '{root}\*\SiteSecurityServiceState.*', kind = "file" },
]

[[template.option]]
id = "downloads"
name = "Download history"
description = "The list of downloaded files (the files themselves stay)"
actions = [
  { op = "sqlite", search = "glob", path = '{root}\*\places.sqlite', sql = "mozilla-downloads" },
  { op = "delete", search = "glob", path = '{root}\*\downloads.sqlite', kind = "file" },
  { op = "delete", search = "glob", path = '{root}\*\downloads.json', kind = "file" },
]

[[template.option]]
id = "session"
name = "Session"
description = "The tabs and windows open last time"
warning = "Your open tabs will not be restored the next time the browser starts."
actions = [
  { op = "delete", search = "glob", path = '{root}\*\sessionstore.jsonlz4', kind = "file" },
  { op = "delete", search = "glob", path = '{root}\*\sessionstore.js', kind = "file" },
  { op = "delete", search = "walk.all", path = '{root}\*\sessionstore-backups' },
]

[[template.option]]
id = "forms"
name = "Form history"
description = "Words typed into web forms and the search bar"
actions = [{ op = "delete", search = "glob", path = '{root}\*\formhistory.sqlite*', kind = "file" }]

[[template.option]]
id = "passwords"
name = "Saved passwords"
description = "Passwords saved on this PC"
warning = "Saved passwords are deleted from this PC. Passwords synced to an account may come back."
actions = [
  { op = "delete", search = "glob", path = '{root}\*\logins.json', kind = "file" },
  { op = "delete", search = "glob", path = '{root}\*\logins-backup.json', kind = "file" },
  { op = "delete", search = "glob", path = '{root}\*\signons.sqlite', kind = "file" },
]

[[template.option]]
id = "site_storage"
name = "Site storage"
description = "Data sites keep on your PC: local storage and IndexedDB"
warning = "Sites forget data they keep locally, such as offline mail, game progress and settings."
actions = [
  { op = "delete", search = "walk.all", path = '{root}\*\storage\default', exclude = ['{root}\*\storage\default\moz-extension+++*'] },
  { op = "delete", search = "walk.all", path = '{root}\*\storage\temporary' },
  { op = "delete", search = "glob", path = '{root}\*\webappsstore.sqlite*', kind = "file" },
]

[[template.option]]
id = "site_preferences"
name = "Site preferences"
description = "Per-site settings such as zoom level"
actions = [{ op = "delete", search = "glob", path = '{root}\*\content-prefs.sqlite*', kind = "file" }]

[[template.option]]
id = "crash_reports"
name = "Crash reports"
description = "Reports kept after the browser crashed"
default = true
actions = [
  { op = "delete", search = "walk.all", path = '{base}\Crash Reports\pending' },
  { op = "delete", search = "walk.all", path = '{base}\Crash Reports\submitted' },
  { op = "delete", search = "walk.all", path = '{root}\*\minidumps' },
]

[[template.option]]
id = "telemetry"
name = "Telemetry"
description = "Usage reports saved before sending"
default = true
actions = [
  { op = "delete", search = "walk.all", path = '{root}\*\datareporting\archived' },
  { op = "delete", search = "walk.all", path = '{root}\*\saved-telemetry-pings' },
]

[[template.option]]
id = "backups"
name = "Bookmark backups"
description = "Daily copies of your bookmarks"
warning = "Bookmarks can no longer be restored from an earlier day."
actions = [{ op = "delete", search = "walk.all", path = '{root}\*\bookmarkbackups' }]

[[template.option]]
id = "vacuum"
name = "Vacuum"
description = "Compact the browser's databases to give back unused space (keeps their data)"
actions = [{ op = "sqlite", search = "glob", path = '{root}\*\*.sqlite', sql = "vacuum" }]

