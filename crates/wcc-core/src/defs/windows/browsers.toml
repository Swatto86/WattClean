# Web browsers. Chromium-based browsers share the "chromium" template and
# Firefox-based ones the "firefox" template (both in templates.toml); each
# cleaner only says where its folders are. {root} is the data folder;
# {profile} matches each profile in it, {cache} each profile cache folder.

[[cleaner]]
id = "chrome"
name = "Google Chrome"
description = "Web browser"
category = "browsers"
template = "chromium"
vars = { root = '%LOCALAPPDATA%\Google\Chrome\User Data' }
detect = ['{root}']
running = ["chrome.exe"]

[[cleaner]]
id = "edge"
name = "Microsoft Edge"
description = "Web browser"
category = "browsers"
template = "chromium"
vars = { root = '%LOCALAPPDATA%\Microsoft\Edge\User Data' }
detect = ['{root}']
running = ["msedge.exe"]

