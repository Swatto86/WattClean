[[cleaner]]
id = "seamonkey"
name = "SeaMonkey"
description = "Web browser and mail"
category = "browsers"
template = "firefox"
vars = { base = '%APPDATA%\Mozilla\SeaMonkey', cachebase = '%LOCALAPPDATA%\Mozilla\SeaMonkey' }
detect = ['{root}']
running = ["seamonkey.exe"]

[[cleaner]]
id = "thunderbird"
name = "Thunderbird"
description = "Mail"
category = "browsers"
template = "firefox"
vars = { base = '%APPDATA%\Thunderbird', cachebase = '%LOCALAPPDATA%\Thunderbird' }
# Mail account passwords and open mail tabs are not browsing data.
skip = ["passwords", "session", "downloads", "backups", "telemetry"]
detect = ['{root}']
running = ["thunderbird.exe"]

[[cleaner]]
id = "internet_explorer"
name = "Internet Explorer"
description = "Windows' own web cache, also used by many programs"
category = "browsers"
running = ["iexplore.exe"]

[[cleaner.option]]
id = "cache"
name = "Cache"
description = "Temporary Internet Files"
default = true
actions = [{ op = "delete", search = "walk.all", path = '%LOCALAPPDATA%\Microsoft\Windows\INetCache' }]

[[cleaner.option]]
id = "cookies"
name = "Cookies"
description = "Cookies kept by Windows' web components"
warning = "Programs that use Windows' web components may sign you out."
actions = [{ op = "delete", search = "walk.all", path = '%LOCALAPPDATA%\Microsoft\Windows\INetCookies' }]

[[cleaner.option]]
id = "history"
name = "History"
description = "Pages visited with Internet Explorer and typed addresses"
actions = [
  { op = "delete", search = "walk.all", path = '%LOCALAPPDATA%\Microsoft\Windows\History' },
  { op = "registry", key = 'HKCU\Software\Microsoft\Internet Explorer\TypedURLs' },
  { op = "registry", key = 'HKCU\Software\Microsoft\Internet Explorer\TypedURLsTime' },
]
