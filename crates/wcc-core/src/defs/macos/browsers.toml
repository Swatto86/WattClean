# Web browsers on macOS, on the shared templates (templates.toml). Chromium
# browsers keep the profile in Application Support and the disk cache in
# Caches. Safari's folders are protected by macOS (Full Disk Access).

[[cleaner]]
id = "safari"
name = "Safari"
description = "Web browser"
category = "browsers"
detect = ['%HOME%/Library/Safari', '%HOME%/Library/Containers/com.apple.Safari']
running = ["safari"]

[[cleaner.option]]
id = "cache"
name = "Cache"
description = "Web pages, images and scripts kept to load sites faster"
default = true
actions = [
  { op = "delete", search = "walk.all", path = '%HOME%/Library/Caches/com.apple.Safari' },
  { op = "delete", search = "walk.all", path = '%HOME%/Library/Containers/com.apple.Safari/Data/Library/Caches' },
]

[[cleaner.option]]
id = "history"
name = "History"
description = "Visited pages"
warning = "Quit Safari first. History synced through iCloud may come back from your other devices."
actions = [{ op = "delete", search = "glob", path = '%HOME%/Library/Safari/History.db*', kind = "file" }]

[[cleaner.option]]
id = "cookies"
name = "Cookies"
description = "Small files sites keep to recognise you, including sign-ins"
warning = "You will be signed out of most websites."
actions = [
  { op = "delete", path = '%HOME%/Library/Cookies/Cookies.binarycookies' },
  { op = "delete", path = '%HOME%/Library/Containers/com.apple.Safari/Data/Library/Cookies/Cookies.binarycookies' },
]

[[cleaner]]
id = "chrome"
name = "Google Chrome"
description = "Web browser"
category = "browsers"
template = "chromium"
vars = { root = '%HOME%/Library/Application Support/Google/Chrome', cache = '%HOME%/Library/Caches/Google/Chrome/*' }
detect = ['{root}']
running = ["google chrome"]

