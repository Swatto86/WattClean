# Web browsers on Linux, on the shared templates (templates.toml). Chromium
# browsers keep the profile in the config folder and the disk cache in the
# cache folder; Firefox keeps profiles straight in its folder. Snap and
# Flatpak builds keep their own copies under ~/snap and ~/.var/app. A
# Chromium browser is present when it has a profile ("Local State"): other
# apps put native-messaging files in the folders of browsers not installed.

[[cleaner]]
id = "chrome"
name = "Google Chrome"
description = "Web browser"
category = "browsers"
template = "chromium"
vars = { root = '%XDG_CONFIG_HOME%/google-chrome', cache = '%XDG_CACHE_HOME%/google-chrome/*' }
detect = ['{root}/Local State']
running = ["chrome"]

[[cleaner]]
id = "chromium"
name = "Chromium"
description = "Web browser"
category = "browsers"
template = "chromium"
vars = { root = '%XDG_CONFIG_HOME%/chromium', cache = '%XDG_CACHE_HOME%/chromium/*' }
detect = ['{root}/Local State']
running = ["chromium", "chromium-browse"]

[[cleaner]]
id = "chromium_snap"
name = "Chromium (Snap)"
description = "Web browser"
category = "browsers"
template = "chromium"
vars = { root = '%HOME%/snap/chromium/common/chromium', cache = '%HOME%/snap/chromium/common/.cache/chromium/*' }
detect = ['{root}/Local State']
running = ["chromium", "chrome"]

[[cleaner]]
id = "chromium_flatpak"
name = "Chromium (Flatpak)"
description = "Web browser"
category = "browsers"
template = "chromium"
vars = { root = '%HOME%/.var/app/org.chromium.Chromium/config/chromium', cache = '%HOME%/.var/app/org.chromium.Chromium/cache/chromium/*' }
detect = ['{root}/Local State']
running = ["chromium", "chrome"]

[[cleaner]]
id = "edge"
name = "Microsoft Edge"
description = "Web browser"
category = "browsers"
template = "chromium"
vars = { root = '%XDG_CONFIG_HOME%/microsoft-edge', cache = '%XDG_CACHE_HOME%/microsoft-edge/*' }
detect = ['{root}/Local State']
running = ["msedge"]

[[cleaner]]
id = "brave"
name = "Brave"
description = "Web browser"
category = "browsers"
