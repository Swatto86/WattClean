[package]
name = "wcc-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WattClean on Windows: known folders, registry, Recycle Bin, clipboard, processes, drives"

[dependencies]
wcc-core = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = { workspace = true }

# This crate is the one place that calls Win32 directly (known folders, the
# Recycle Bin, the clipboard, processes, the process token, drives, delete
# at restart, starting elevated), so it cannot inherit the workspace's
# `unsafe_code = "forbid"`. Every unsafe block carries a SAFETY comment,
# which clippy enforces.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
unwrap_used = "warn"
expect_used = "warn"
