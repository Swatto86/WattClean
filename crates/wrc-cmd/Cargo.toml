[package]
name = "wrc-cmd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WattClean's registry cleaner from a console: clean, back up and manage the Registry Watcher"

[dependencies]
wrc-core = { workspace = true }

[target.'cfg(windows)'.dependencies]
wrc-windows = { workspace = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }
wrc-core = { workspace = true, features = ["fake"] }

# console.rs asks Windows whether the app is running (one OpenMutexW call).
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
expect_used = "warn"
